<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lalit AI Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0c10; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #ff007f; text-shadow: 0 0 10px #ff007f; }
        #ai-chat-widget { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        #chat-open-btn { background: linear-gradient(135deg, #ff007f, #7f00ff); color: white; border: none; padding: 12px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(255,0,127,0.4); }
        #chat-window { display: none; width: 320px; height: 450px; background: #1f2833; border-radius: 15px; flex-direction: column; overflow: hidden; box-shadow: 0 5px 25px rgba(0,0,0,0.5); border: 1px solid #45f3ff; }
        #chat-header { background: linear-gradient(135deg, #1f2833, #0b0c10); padding: 15px; font-weight: bold; border-bottom: 1px solid #45f3ff; display: flex; justify-content: space-between; align-items: center; }
        #chat-close-btn { background: none; border: none; color: #ff007f; font-size: 20px; cursor: pointer; }
        #ai-chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .user-msg { align-self: flex-end; background: #45f3ff; color: #000; padding: 8px 12px; border-radius: 12px 12px 0 12px; max-width: 80%; }
        .ai-msg { align-self: flex-start; background: #2f3e46; color: #fff; padding: 8px 12px; border-radius: 12px 12px 12px 0; max-width: 80%; }
        #chat-input-area { padding: 10px; display: flex; gap: 5px; background: #0b0c10; }
        #ai-chat-input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #45f3ff; background: #1f2833; color: white; outline: none; }
        #chat-send-btn { background: #ff007f; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>⚡ LALIT AI HUB ⚡</h1>

    <div id="ai-chat-widget">
        <button id="chat-open-btn">💬 Lalit Gaming AI से पूछें</button>
        <div id="chat-window">
            <div id="chat-header">
                <span>🤖 Lalit AI (Gemini Pro Expert)</span>
                <button id="chat-close-btn">&times;</button>
            </div>
            <div id="ai-chat-box"></div>
            <div id="chat-input-area">
                <input type="text" id="ai-chat-input" placeholder="यहाँ टाइप करें...">
                <button id="chat-send-btn">भेजें</button>
            </div>
        </div>
    </div>

<script>
    const openBtn = document.getElementById("chat-open-btn");
    const closeBtn = document.getElementById("chat-close-btn");
    const chatWindow = document.getElementById("chat-window");
    const chatBox = document.getElementById("ai-chat-box");
    const chatInput = document.getElementById("ai-chat-input");
    const sendBtn = document.getElementById("chat-send-btn");

    openBtn.onclick = () => { chatWindow.style.display = "flex"; openBtn.style.display = "none"; };
    closeBtn.onclick = () => { chatWindow.style.display = "none"; openBtn.style.display = "block"; };

    async function askLalitAI() {
        const promptText = chatInput.value.trim();
        if (!promptText) return;

        chatBox.innerHTML += `<div class="user-msg">${promptText}</div>`;
        chatInput.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        let apiKey = localStorage.getItem("g_key");
        if (!apiKey) {
            apiKey = prompt("भाई, सुरक्षा के लिए अपनी Gemini API Key यहाँ पेस्ट करो:");
            if (apiKey) localStorage.setItem("g_key", apiKey);
            else return;
        }

        const systemInstruction = "तुम एक गेमिंग AI असिस्टेंट हो जो Lalit के प्रोजेक्ट पर काम कर रहा है।";
        const fullPrompt = `${systemInstruction}\nयूज़र का संदेश: ${promptText}`;

        try {
            const response = await fetch(`https://googleapis.com{apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: fullPrompt }] }] })
            });
            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;
            chatBox.innerHTML += `<div class="ai-msg"><b>AI:</b> ${aiResponse}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<div class="ai-msg" style="color: #ff007f;">❌ कनेक्शन एरर! कृपया अपनी API Key चेक करें।</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    sendBtn.onclick = askLalitAI;
    chatInput.addEventListener("keypress", (event) => {
        if (event.key === "Enter") askLalitAI();
    });
</script>
</body>
</html>
